###################################################
# Services
###################################################
services:

  ###################################################
  # Service: backend
  ###################################################
  backend:
    ports:
      - 8188:8188
      - 2222:22
      - 3000:3000
    image: zinigor/comfy:0.8
    build:
      context: ./
      target: backend-dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
