###################################################
# Services
###################################################
services:

  ###################################################
  # Service: backend
  ###################################################
  backend:
    ports:
      - 8182:8188
    image: zinigor/comfy:0.5
    build:
      context: ./
      target: backend-dev
    environment:
      DUMMY: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
