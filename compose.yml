###################################################
# Services
###################################################
services:

  ###################################################
  # Service: backend
  ###################################################
  backend:
    ports:
      - 8188:8188
      - 2222:22
    image: zinigor/comfy:0.7
    build:
      context: ./
      target: backend-dev
    environment:
      __COMFYUI_DESKTOP_VERSION__: 0.3.39
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
