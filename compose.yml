###################################################
# Services
###################################################
services:

  ###################################################
  # Service: backend
  ###################################################
  backend:
    ports:
      - 8188:8188
      - 2222:22
      - 3000:3000
    image: zinigor/comfy:0.9
    env_file: .env
    # environment:
    # PUBLIC_KEY: You can also put your key in the .env file when running docker compose.
    build:
      context: ./
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
